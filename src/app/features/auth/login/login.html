<div class="login-container" #container>
    <div class="content">
        <div class="form-box login">
            <form (ngSubmit)="onLogin()">
                <h1>Login</h1>
                <div class="input-box">
                    <input type="text" [(ngModel)]="loginForm.user" name="user" placeholder="Username" required>
                    <i class="pi pi-user"></i>
                </div>
                <div class="input-box">
                    <input [type]="showPasswordLogin ? 'text' : 'password'" [(ngModel)]="loginForm.password" name="password" placeholder="Password" required>
                    <i [class]="showPasswordLogin ? 'pi pi-eye-slash' : 'pi pi-eye'" (click)="togglePasswordLogin()" style="cursor: pointer;"></i>
                </div>

                <button class="cta-button" type="submit">Login</button>

            </form>
        </div>

        <div class="form-box register">
            <form (ngSubmit)="onRegister()">
                <h1>Register</h1>
                <div class="input-box">
                    <input type="text" [(ngModel)]="registerForm.username" name="username" placeholder="Username" required>
                    <i class="pi pi-user"></i>
                </div>
                <div class="input-box">
                    <input type="email" [(ngModel)]="registerForm.email" name="email" placeholder="Email" required>
                    <i class="pi pi-envelope"></i>
                </div>
                <div class="input-box">
                    <input [type]="showPasswordRegister ? 'text' : 'password'" [(ngModel)]="registerForm.password" name="password" placeholder="Password" required>
                    <i [class]="showPasswordRegister ? 'pi pi-eye-slash' : 'pi pi-eye'" (click)="togglePasswordRegister()" style="cursor: pointer;"></i>
                </div>
                <button class="cta-button" type="submit">Register</button>

            </form>
        </div>

        <div class="toggle-box">
            <div class="toggle-panel toggle-left">
                <img src="assets/img/ateneo_logo.png" alt="Logo Ateneo" class="watermark">
                <h1>Hola, Bienvenido a Ateneo!</h1>
                <p>¿No tienes una cuenta?</p>
                <button class="cta-button-2" #registerButton>Registrarse</button>
            </div>
            <div class="toggle-panel toggle-right">
                <img src="assets/img/ateneo_logo.png" alt="Logo Ateneo" class="watermark">
                <h1>Hola, Bienvenido a Ateneo!</h1>
                <p>¿Ya tienes una cuenta?</p>
                <button class="cta-button-2" #loginButton>Login</button>
            </div>
        </div>
    </div>
</div>
