<div class="p-6 flex flex-col gap-4 w-full bg-[var(--color-bg-soft)] text-[var(--color-text-main)]">
  <div class="flex items-center justify-between pb-3 border-b border-[color-mix(in_srgb,var(--color-text-main)_12%,transparent)]">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-indigo-500/15 text-indigo-400 flex items-center justify-center">
        <mat-icon>label</mat-icon>
      </div>
      <div>
        <h2 class="text-base font-bold m-0 text-[var(--color-text-main)]">Gestionar Etiquetas</h2>
        <p class="text-xs m-0 text-[var(--color-text-muted)] truncate max-w-sm">{{ data.file.name }}</p>
      </div>
    </div>
    <button type="button" mat-icon-button (click)="close()" class="text-[var(--color-text-muted)] hover:text-[var(--color-text-main)]">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="flex flex-col gap-3 py-2">
    <span class="text-xs font-semibold text-[var(--color-text-muted)]">Etiquetas actuales</span>

    <div class="flex flex-wrap gap-1.5 min-h-[38px] p-2.5 rounded-xl bg-[color-mix(in_srgb,var(--color-bg-light)_50%,transparent)] border border-[color-mix(in_srgb,var(--color-text-main)_10%,transparent)] items-center">
      @for (tag of tags; track tag) {
        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-xs font-medium bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">
          <span>#{{ tag }}</span>
          <button type="button" (click)="removeTag(tag)" class="hover:text-rose-400 focus:outline-none flex items-center">
            <mat-icon class="text-xs w-3.5 h-3.5">close</mat-icon>
          </button>
        </span>
      } @empty {
        <span class="text-xs text-[var(--color-text-muted)] italic">No hay etiquetas agregadas a este documento.</span>
      }
    </div>

    <div class="flex items-center gap-2 mt-1">
      <mat-form-field appearance="outline" floatLabel="always" class="flex-1" subscriptSizing="dynamic">
        <mat-label>Nueva etiqueta</mat-label>
        <input 
          matInput 
          [(ngModel)]="newTag" 
          (keydown)="onKeyDown($event)"
          placeholder="Escribe y presiona Enter o coma" />
        <mat-icon matPrefix class="mr-2 text-indigo-400">tag</mat-icon>
      </mat-form-field>

      <button 
        type="button" 
        mat-stroked-button 
        (click)="addTag()" 
        [disabled]="!newTag.trim()"
        class="h-12 px-4 rounded-xl">
        <mat-icon>add</mat-icon>
        <span>Agregar</span>
      </button>
    </div>
  </div>

  <div class="flex items-center justify-end gap-2 pt-3 border-t border-[color-mix(in_srgb,var(--color-text-main)_10%,transparent)]">
    <button type="button" mat-button (click)="close()" class="text-[var(--color-text-muted)]">
      Cancelar
    </button>
    <button 
      type="button" 
      mat-flat-button 
      color="primary" 
      [disabled]="saving"
      (click)="save()">
      @if (saving) {
        <mat-spinner diameter="18" class="mr-2"></mat-spinner>
      } @else {
        <mat-icon>check</mat-icon>
      }
      <span>Guardar etiquetas</span>
    </button>
  </div>
</div>
